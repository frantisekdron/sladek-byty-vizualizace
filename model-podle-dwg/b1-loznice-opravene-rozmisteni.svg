<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="990" viewBox="0 0 1000 990"><rect width="1000" height="990" fill="#f7f6f1"/><style>text{font-family:Arial,sans-serif;fill:#263c33} .small{font-size:15px} .dim{font-size:17px;fill:#246b59}</style><text x="50" y="48" font-size="28" font-weight="bold">Byt 1 · ložnice · opravené rozmístění</text><text x="50" y="78" font-size="17">Návrh podle upřesnění zadavatele · 27. 10. 2026 · rozměry v mm</text><polygon points="170,760 655.75,760 655.75,151.0 590.5,151.0 590.5,114.75 170,114.75" fill="#ede6d9" stroke="#263c33" stroke-width="5"/><path d="M170,564.25 V303.25" stroke="#74acbb" stroke-width="8"/><path d="M655.75,302.52500000000003 V185.79999999999995" stroke="#f7f6f1" stroke-width="9"/><rect x="539.025" y="185.79999999999995" width="116.72500000000001" height="116.72500000000001" fill="#e1bd7a" opacity=".3" stroke="#997129" stroke-dasharray="5 4"/><rect x="351.25" y="346.75" width="304.5" height="232.0" rx="4" fill="#c8d8cd" stroke="#52665a" stroke-width="2"/><rect x="637.75" y="351.75" width="13" height="222.0" fill="#52665a"/><text x="503.5" y="457.75" text-anchor="middle" class="small">POSTEL</text><text x="503.5" y="478.75" text-anchor="middle" class="small">rám 1 600 × 2 100</text><rect x="191.75" y="114.75" width="188.5" height="87.0" rx="4" fill="#d8bd94" stroke="#52665a" stroke-width="2"/><text x="286.0" y="153.25" text-anchor="middle" class="small">STŮL</text><text x="286.0" y="174.25" text-anchor="middle" class="small">1 300 × 600</text><rect x="249.75" y="201.75" width="79.75" height="87.0" rx="4" fill="#d8bd94" stroke="#52665a" stroke-width="2"/><text x="289.625" y="240.25" text-anchor="middle" class="small">ŽIDLE</text><rect x="220.75" y="673.0" width="435" height="87.0" rx="4" fill="#d8bd94" stroke="#52665a" stroke-width="2"/><text x="438.25" y="711.5" text-anchor="middle" class="small">VESTAVĚNÁ SKŘÍŇ · POSUVNÁ</text><text x="438.25" y="732.5" text-anchor="middle" class="small">3 000 × 600 · výška 2 600</text><path d="M170,615.0 L351.25,615.0" stroke="#246b59" stroke-width="2"/><text x="260.625" y="608.0" text-anchor="middle" class="dim">1 250</text><path d="M460,673.0 L460,578.75" stroke="#246b59" stroke-width="2"/><text x="460.0" y="618.875" text-anchor="middle" class="dim">650</text><path d="M170,803.5 L655.75,803.5" stroke="#246b59" stroke-width="2"/><text x="412.875" y="796.5" text-anchor="middle" class="dim">3 350</text><path d="M97.5,760 L97.5,114.75" stroke="#246b59" stroke-width="2"/><text x="97.5" y="430.375" text-anchor="middle" class="dim">4 450</text><text x="705" y="200" class="small">Stůl napravo při pohledu</text><text x="705" y="223" class="small">na francouzské okno.</text><text x="705" y="285" class="small">Žlutě: rezervovaný prostor</text><text x="705" y="308" class="small">pro otevření vstupních dveří.</text><text x="705" y="420" class="small">Čelo postele na východní</text><text x="705" y="443" class="small">stěně, nohy směrem k oknu.</text><text x="50" y="855" font-size="17">Skříň nahrazuje obraz nad původním umístěním postele.</text><text x="50" y="887" class="small">Obrys místnosti a otvory z DWG. Nábytek má navržené vnější rozměry, nikoli rozměry matrace.</text><text x="50" y="913" class="small">650 mm je odstup k zavřené posuvné skříni. Směr a rozsah otevření křídel je nutné ověřit.</text><text x="50" y="939" class="small">Tento výkres opravuje rozmístění; předchozí perspektivní vizualizace zatím zůstávají neaktuální.</text></svg>