<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><rect width="1400" height="1000" fill="#f5f3ed"/><g font-family="Helvetica" fill="#263c33"><text x="65" y="65" font-size="32">Byt 2 · kuchyň — boční řez skříňkami</text><text x="65" y="105" font-size="18">Doplnění podle komentáře zadavatele · rozměry v mm</text><path d="M240 170V860H730" fill="none" stroke="#344b41" stroke-width="7"/><path d="M240 170H730" stroke="#344b41" stroke-width="7"/><rect x="240" y="170" width="300" height="120" fill="#d5bb95" stroke="#52665a" stroke-width="2"/><rect x="240" y="290" width="150" height="170" fill="#e3d5c1" stroke="#52665a" stroke-width="2"/><rect x="240" y="620" width="300" height="240" fill="#d5bb95" stroke="#52665a" stroke-width="2"/><path d="M540 165V865" stroke="#658a77" stroke-width="2" stroke-dasharray="9 8"/><path d="M390 470H540" stroke="#658a77" stroke-width="2"/><text x="275" y="230" font-size="23">600 hluboká</text><text x="250" y="380" font-size="22">300</text><text x="275" y="735" font-size="22">Spodní linka</text><text x="760" y="180" font-size="24">Strop: 2600 — potvrzeno</text><text x="760" y="285" font-size="22">Dělení v úrovni horní hrany lednice</text><text x="760" y="325" font-size="18">Model lednice: 2150, dle výběru výrobku upravit.</text><text x="760" y="400" font-size="22">Spodní závěsná řada zapuštěná</text><text x="760" y="435" font-size="18">Hloubka přibližně 300.</text><text x="760" y="510" font-size="22">Horní řada až ke stropu</text><text x="760" y="545" font-size="18">Čelo a pravý bok zarovnat s lednicí.</text><text x="760" y="620" font-size="22">Mikrovlnka vedle lednice</text><text x="760" y="655" font-size="18">V nižší závěsné skříňce, v pohledu vlevo.</text><text x="760" y="690" font-size="18">Nika lokálně podle hloubky spotřebiče.</text><text x="760" y="725" font-size="18">Zajistit větrání dle konkrétního výrobku.</text><text x="65" y="925" font-size="19">Schéma návrhu; ne výrobní dokumentace. Výšky závěsné řady a nika se doladí dle spotřebičů.</text></g></svg>