<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#f5f3ed"/><style>text{font-family:Arial,sans-serif;fill:#263c33}.sm{font-size:16px}.n{font-size:18px;font-weight:bold}</style><text font-family="Helvetica" x="65" y="62" font-size="32" font-weight="bold">Byt 2 · stávající koupelna</text><text font-family="Helvetica" x="65" y="95" font-size="17">Rozmístění podle DWG a doplnění zadavatele · společná dispozice pro tři styly</text><polygon points="90.0,770.0 860.0,770.0 860.0,216.5 90.0,216.5" fill="#e8dfcf" stroke="#344b41" stroke-width="6"/><path d="M90.0,537.0818505338078 L90.0,345.2669039145907" stroke="#f5f3ed" stroke-width="11"/><rect x="663.006049822064" y="283.0914590747331" width="182.4982206405694" height="411.85409252669035" rx="3" fill="#e5eff0" stroke="#52665a" stroke-width="1.5"/><circle cx="754.2551601423488" cy="489.01850533807834" r="14" fill="#fff"/><text font-family="Helvetica" x="754.2551601423488" y="495.01850533807834" text-anchor="middle" class="n">1</text><rect x="190.64804270462633" y="216.47686832740214" width="219.21708185053382" height="104.12811387900356" rx="3" fill="#e5eff0" stroke="#52665a" stroke-width="1.5"/><circle cx="300.25658362989327" cy="268.54092526690397" r="14" fill="#fff"/><text font-family="Helvetica" x="300.25658362989327" y="274.54092526690397" text-anchor="middle" class="n">2</text><rect x="90.0" y="594.0782918149466" width="176.46975088967972" height="175.92170818505338" rx="3" fill="#d5bb95" stroke="#52665a" stroke-width="1.5"/><circle cx="178.23487544483987" cy="682.0391459074733" r="14" fill="#fff"/><text font-family="Helvetica" x="178.23487544483987" y="688.0391459074733" text-anchor="middle" class="n">3</text><text font-family="Helvetica" x="475.0" y="825" font-size="20" text-anchor="middle">2,810 mm</text><text font-family="Helvetica" x="70" y="450" font-size="20" transform="rotate(-90 70 450)">2,020 mm</text><text font-family="Helvetica" x="960" y="180" font-size="24" font-weight="bold">Obrysy vybavení</text><text font-family="Helvetica" x="960" y="222" font-size="17">01  Vana</text><text font-family="Helvetica" x="1430" y="222" text-anchor="end" class="sm">666 × 1503 mm</text><text font-family="Helvetica" x="960" y="264" font-size="17">02  Umyvadlo</text><text font-family="Helvetica" x="1430" y="264" text-anchor="end" class="sm">800 × 380 mm</text><text font-family="Helvetica" x="960" y="306" font-size="17">03  Spotřebič</text><text font-family="Helvetica" x="1430" y="306" text-anchor="end" class="sm">644 × 642 mm</text><text font-family="Helvetica" x="65" y="895" font-size="17">Rozměry symbolů z DWG; skutečné provedení koupelny zachováváme podle fotografií.</text><text font-family="Helvetica" x="65" y="924" font-size="17">Strop 2 600 · dveře 1 970 · parapet 800 · horní hrana okna 2 350 mm. Výšky dodané zadavatelem.</text><text font-family="Helvetica" x="65" y="953" font-size="15">Podklad pro návrh zařízení, nikoli zaměření stavby nebo montážní dokumentace. Návrhy židlí jsou v zasunuté poloze.</text></svg>