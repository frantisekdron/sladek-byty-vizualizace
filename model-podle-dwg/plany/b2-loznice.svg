s="n">3</text><rect x="707.8081258658451" y="338.87384098917585" width="103.4702781625978" height="206.9405563251956" rx="3" fill="#d5bb95" stroke="#52665a" stroke-width="1.5"/><circle cx="759.5432649471439" cy="442.34411915177367" r="14" fill="#fff"/><text font-family="Helvetica" x="759.5432649471439" y="448.34411915177367" text-anchor="middle" class="n">4</text><text font-family="Helvetica" x="475.0" y="825" font-size="20" text-anchor="middle">4,300 mm</text><text font-family="Helvetica" x="70" y="450" font-size="20" transform="rotate(-90 70 450)">3,479 mm</text><text font-family="Helvetica" x="960" y="180" font-size="24" font-weight="bold">Obrysy vybavení</text><text font-family="Helvetica" x="960" y="222" font-size="17">01  Postel</text><text font-family="Helvetica" x="1430" y="222" text-anchor="end" class="sm">2100 × 1800 mm</text><text font-family="Helvetica" x="960" y="264" font-size="17">02  Noční stolek</text><text font-family="Helvetica" x="1430" y="264" text-anchor="end" class="sm">450 × 400 mm</text><text font-family="Helvetica" x="960" y="306" font-size="17">03  Noční stolek</text><text font-family="Helvetica" x="1430" y="306" text-anchor="end" class="sm">450 × 400 mm</text><text font-family="Helvetica" x="960" y="348" font-size="17">04  Skříň</text><text font-family="Helvetica" x="1430" y="348" text-anchor="end" class="sm">600 × 1200 mm</text><text font-family="Helvetica" x="65" y="895" font-size="17">Nábytek má navržené vnější rozměry. Čela a obrysy linky dle DWG; konkrétní výrobky vyžadují výběr.</text><text font-family="Helvetica" x="65" y="924" font-size="17">Strop 2 600 · dveře 1 970 · parapet 800 · horní hrana okna 2 350 mm. Výšky dodané zadavatelem.</text><text font-family="Helvetica" x="65" y="953" font-size="15">Podklad pro návrh zařízení, nikoli zaměření stavby nebo montážní dokumentace. Návrhy židlí jsou v zasunuté poloze.</text></svg>