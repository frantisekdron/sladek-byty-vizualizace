"Helvetica" x="475.0" y="825" font-size="20" text-anchor="middle">4,100 mm</text><text font-family="Helvetica" x="70" y="450" font-size="20" transform="rotate(-90 70 450)">4,076 mm</text><text font-family="Helvetica" x="960" y="180" font-size="24" font-weight="bold">Obrysy vybavení</text><text font-family="Helvetica" x="960" y="222" font-size="17">01  Sedačka</text><text font-family="Helvetica" x="1430" y="222" text-anchor="end" class="sm">1000 × 2400 mm</text><text font-family="Helvetica" x="960" y="264" font-size="17">02  Sedačka</text><text font-family="Helvetica" x="1430" y="264" text-anchor="end" class="sm">799 × 630 mm</text><text font-family="Helvetica" x="960" y="306" font-size="17">03  Stolek</text><text font-family="Helvetica" x="1430" y="306" text-anchor="end" class="sm">600 × 1200 mm</text><text font-family="Helvetica" x="960" y="348" font-size="17">04  Jídelní stůl</text><text font-family="Helvetica" x="1430" y="348" text-anchor="end" class="sm">1374 × 700 mm</text><text font-family="Helvetica" x="960" y="390" font-size="17">05  Linka / varná deska</text><text font-family="Helvetica" x="1430" y="390" text-anchor="end" class="sm">2910 × 600 mm</text><text font-family="Helvetica" x="960" y="432" font-size="17">06  Vysoký modul</text><text font-family="Helvetica" x="1430" y="432" text-anchor="end" class="sm">600 × 600 mm</text><text font-family="Helvetica" x="960" y="474" font-size="17">07  TV / skříňka</text><text font-family="Helvetica" x="1430" y="474" text-anchor="end" class="sm">600 × 1000 mm</text><text font-family="Helvetica" x="65" y="895" font-size="17">Nábytek má navržené vnější rozměry. Čela a obrysy linky dle DWG; konkrétní výrobky vyžadují výběr.</text><text font-family="Helvetica" x="65" y="924" font-size="17">Strop 2 600 · dveře 1 970 · parapet 800 · horní hrana okna 2 350 mm. Výšky dodané zadavatelem.</text><text font-family="Helvetica" x="65" y="953" font-size="15">Podklad pro návrh zařízení, nikoli zaměření stavby nebo montážní dokumentace. Návrhy židlí jsou v zasunuté poloze.</text></svg>