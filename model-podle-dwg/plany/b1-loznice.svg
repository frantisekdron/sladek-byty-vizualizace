<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#f5f3ed"/><style>text{font-family:Arial,sans-serif;fill:#263c33}.sm{font-size:16px}.n{font-size:18px;font-weight:bold}</style><text font-family="Helvetica" x="65" y="62" font-size="32" font-weight="bold">Byt 1 · ložnice</text><text font-family="Helvetica" x="65" y="95" font-size="17">Rozmístění podle DWG a doplnění zadavatele · společná dispozice pro tři styly</text><polygon points="249.2,770.0 700.8,770.0 700.8,203.7 640.2,203.7 640.2,170.0 249.2,170.0" fill="#e8dfcf" stroke="#344b41" stroke-width="6"/><path d="M249.15730337078654,587.9775280898876 L249.15730337078654,345.2808988764046" stroke="#72aeb8" stroke-width="11"/><path d="M700.8426966292135,344.6067415730338 L700.8426966292135,236.0674157303372" stroke="#f5f3ed" stroke-width="11"/><rect x="417.6966292134831" y="385.7303370786517" width="283.14606741573033" height="215.73033707865167" rx="3" fill="#b8cabc" stroke="#52665a" stroke-width="1.5"/><circle cx="559.2696629213483" cy="493.5955056179776" r="14" fill="#fff"/><text font-family="Helvetica" x="559.2696629213483" y="499.5955056179776" text-anchor="middle" class="n">1</text><rect x="690.0561797752808" y="385.7303370786517" width="10.786516853932582" height="215.73033707865167" fill="#52665a"/><rect x="249.15730337078654" y="170.0000000000001" width="80.89887640449437" height="175.28089887640448" rx="3" fill="#d5bb95" stroke="#52665a" stroke-width="1.5"/><circle cx="289.60674157303373" cy="257.6404494382024" r="14" fill="#fff"/><text font-family="Helvetica" x="289.60674157303373" y="263.6404494382024" text-anchor="middle" class="n">2</text><rect x="336.7977528089888" y="217.19101123595522" width="80.89887640449437" height="74.15730337078651" rx="8" fill="#b8cabc" stroke="#52665a" opacity=".8"/><rect x="296.3483146067416" y="689.1011235955057" width="404.4943820224719" height="80.89887640449437" rx="3" fill="#d5bb95" stroke="#52665a" stroke-width="1.5"/><circle cx="498.59550561797755" cy="729.5505617977528" r="14" fill="#fff"/><text font-family="Helvetica" x="498.59550561797755" y="735.5505617977528" text-anchor="middle" class="n">3</text><text font-family="Helvetica" x="475.0" y="825" font-size="20" text-anchor="middle">3,350 mm</text><text font-family="Helvetica" x="70" y="450" font-size="20" transform="rotate(-90 70 450)">4,450 mm</text><text font-family="Helvetica" x="960" y="180" font-size="24" font-weight="bold">Obrysy vybavení</text><text font-family="Helvetica" x="960" y="222" font-size="17">01  Postel</text><text font-family="Helvetica" x="1430" y="222" text-anchor="end" class="sm">2100 × 1600 mm</text><text font-family="Helvetica" x="960" y="264" font-size="17">02  Stůl</text><text font-family="Helvetica" x="1430" y="264" text-anchor="end" class="sm">600 × 1300 mm</text><text font-family="Helvetica" x="960" y="306" font-size="17">03  Skříň</text><text font-family="Helvetica" x="1430" y="306" text-anchor="end" class="sm">3000 × 600 mm</text><text font-family="Helvetica" x="65" y="895" font-size="17">Nábytek má navržené vnější rozměry. Čela a obrysy linky dle DWG; konkrétní výrobky vyžadují výběr.</text><text font-family="Helvetica" x="65" y="924" font-size="17">Strop 2 600 · dveře 1 970 · parapet 800 · horní hrana okna 2 350 mm. Výšky dodané zadavatelem.</text><text font-family="Helvetica" x="65" y="953" font-size="15">Podklad pro návrh zařízení, nikoli zaměření stavby nebo montážní dokumentace. Návrhy židlí jsou v zasunuté poloze.</text></svg>